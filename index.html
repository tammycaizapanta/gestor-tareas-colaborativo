<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="encabezado">
      <p class="etiqueta">HOY</p>
      <h1>Gestor de Tareas</h1>
    </header>

    <form id="formTarea">
      <input type="text" id="inputTarea" placeholder="Escribe una tarea..." required>
      <button type="submit" class="btn-agregar" aria-label="Agregar tarea">+</button>
    </form>

    <p class="resumen">Tareas pendientes: <span id="contador">0</span></p>

    <ul id="listaTareas"></ul>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
